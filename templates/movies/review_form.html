{% extends "users/basic.html" %}

{% block title %}Review {{ movie.name }} - BookMySeat{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h3 class="mb-4">Review: {{ movie.name }}</h3>
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="{{ form.rating.id_for_label }}">Rating</label>
                    {{ form.rating }}
                </div>
                <div class="form-group">
                    <label for="{{ form.comment.id_for_label }}">Your review</label>
                    {{ form.comment }}
                </div>
                {% if form.non_field_errors %}
                    <div class="alert alert-danger">{{ form.non_field_errors }}</div>
                {% endif %}
                <button type="submit" class="btn btn-primary">Save Review</button>
                <a href="{% url 'movie_detail' movie.id %}" class="btn btn-link">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
